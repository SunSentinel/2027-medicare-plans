<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 South Florida Medicare Advantage Plans</title>
    
    <!-- Pym.js Resizer for iFrame Embeds -->
    <script src="https://pym.nprapps.org/pym.v1.min.js"></script>

    <style>
        :root {
            /* Restoring the accent colors for better navigation */
            --accent: #0056b3;
            --accent-hover: #003d82;
        }

        /* --- Datawrapper-Inspired Newsroom Theme --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333333;
            background-color: #ffffff;
            margin: 0;
            padding: 10px;
            -webkit-overflow-scrolling: touch; 
        }

        .table-container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* Journalistic Copy Header Styles */
        .chart-header {
            margin-bottom: 22px;
        }

        .chart-title {
            font-size: 22px;
            font-weight: 700;
            color: #111111;
            margin: 0 0 6px 0;
            line-height: 1.2;
        }

        .chart-intro {
            font-size: 14px;
            color: #555555;
            margin: 0;
            line-height: 1.4;
        }

        /* Custom Dropdown Filters Toolbar (Adapted for sticky iframe use) */
        .custom-filter-toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding-bottom: 15px;
            border-bottom: 1px solid #ebeeec;
            position: sticky;
            top: 0;
            background-color: #ffffff;
            z-index: 1000;
            padding-top: 10px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #555555;
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }

        .filter-group input {
            width: 200px;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: #888888;
        }

        /* Card Layout (Styled to match the newsroom table aesthetic) */
        #plan-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            #plan-container {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        .card {
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 15px;
            background-color: #ffffff;
            transition: background-color 0.15s;
        }

        .card:hover {
            background-color: #f7f7f7;
        }

        .card-header {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ebeeec;
        }

        .company-name {
            font-size: 11px;
            color: #666666;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .plan-name {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            color: var(--accent); /* Restored Blue Accent */
            line-height: 1.3;
        }

        .key-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            color: #555555;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: #111111;
        }

        /* Expandable Details */
        .details-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #cccccc;
        }

        .details-content.active {
            display: block;
        }

        .details-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13.5px;
        }

        .details-list li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ebeeec;
        }

        .details-list li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .details-list strong {
            display: block;
            color: #555555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 2px;
        }

        .toggle-btn {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--accent); /* Restored Blue Accent */
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .toggle-btn:hover {
            background-color: var(--accent-hover);
        }

        .card-footer {
            margin-top: 15px;
            text-align: left;
        }

        .card-footer a {
            color: var(--accent); /* Restored Blue Accent */
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .card-footer a:hover {
            text-decoration: underline;
            color: var(--accent-hover);
        }

        /* Source Footnote Styles */
        .chart-footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #ebeeec;
        }

        .chart-source {
            font-size: 11px;
            color: #666666;
            letter-spacing: 0.02em;
            margin: 0;
        }

        /* Accessibility Focus */
        button:focus-visible, 
        select:focus-visible, 
        input:focus-visible, 
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Mobile Breakpoints */
        @media (max-width: 640px) {
            .custom-filter-toolbar {
                flex-direction: column;
                gap: 10px;
            }
            .filter-group {
                width: 100%;
                justify-content: space-between;
            }
            .filter-group select, .filter-group input {
                width: 65%;
            }
        }
    </style>
</head>
<body>

<div class="table-container">
    <header class="chart-header">
        <h1 class="chart-title">2027 South Florida Medicare Advantage Plans</h1>
        <p class="chart-intro">Search and filter Medicare Advantage options across Palm Beach and Broward counties to compare costs, coverage, and ratings.</p>
    </header>

    <div class="custom-filter-toolbar">
        <div class="filter-group">
            <label for="search">Search:</label>
            <input type="text" id="search" placeholder="e.g., Aetna, CarePlus...">
        </div>
        <div class="filter-group">
            <label for="filter-county">County:</label>
            <select id="filter-county">
                <option value="all">All Counties</option>
                <option value="Broward">Broward</option>
                <option value="Palm Beach">Palm Beach</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filter-type">Plan Type:</label>
            <select id="filter-type">
                <option value="all">All Plan Types</option>
                <option value="standard">Standard Plans (No SNP)</option>
                <option value="d-snp">Dual-Eligible (D-SNP)</option>
                <option value="c-snp">Chronic Condition (C-SNP)</option>
                <option value="i-snp">Institutional (I-SNP)</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filter-stars">Rating:</label>
            <select id="filter-stars">
                <option value="all">All Ratings</option>
                <option value="4">4 Stars & Above</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filter-drugs">Drugs:</label>
            <select id="filter-drugs">
                <option value="all">All Plans</option>
                <option value="included">Includes Part D</option>
                <option value="none">No Drug Coverage</option>
            </select>
        </div>
    </div>

    <div id="plan-container"></div>

    <footer class="chart-footer">
        <p class="chart-source">SOURCE: Medicare.gov and health plan providers.</p>
    </footer>
</div>

<script>
    const pymChild = new pym.Child({ polling: 500 });
    let allPlans = [];

    fetch('medicare_cleaned.json')
        .then(response => response.json())
        .then(data => {
            allPlans = data;
            renderPlans(allPlans);
        })
        .catch(error => console.error("Error loading JSON:", error));

    function renderPlans(plans) {
        const container = document.getElementById('plan-container');
        container.innerHTML = '';

        if (plans.length === 0) {
            container.innerHTML = '<p style="font-size: 14px; color: #555555;">No plans match your selected filters. Try adjusting your search.</p>';
            pymChild.sendHeight();
            return;
        }

        plans.forEach((plan, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="card-header">
                    <p class="company-name">${plan.Companies}</p>
                    <h2 class="plan-name">${plan.Name}</h2>
                </div>
                
                <div class="key-stats">
                    <div class="stat">
                        <span class="stat-label">Monthly Premium</span>
                        <span class="stat-value">${plan['Monthly premium'].split('.')[0]}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Star Rating</span>
                        <span class="stat-value">⭐ ${plan['Star rating']}</span>
                    </div>
                </div>

                <button class="toggle-btn" onclick="toggleDetails('details-${index}')">View details</button>

                <div id="details-${index}" class="details-content">
                    <ul class="details-list">
                        <li><strong>Primary Doctor Copay</strong> ${plan.primary_doctor}</li>
                        <li><strong>Specialist Copay</strong> ${plan.specialist}</li>
                        <li><strong>Max Out-of-Pocket</strong> ${plan.max_out_of_pocket}</li>
                        <li><strong>Hospital Stay</strong> ${plan.inpatient_hospital}</li>
                        <li><strong>Dental Coverage</strong> ${plan.dental_coverage}</li>
                        <li><strong>Drug Deductible</strong> ${plan.drug_deductible}</li>
                        <li><strong>Preferred Pharmacies</strong> ${plan.preferred_pharmacies}</li>
                    </ul>
                    <div class="card-footer">
                        <a href="https://${plan.Website}" target="_blank" rel="noopener noreferrer">Visit Plan Website &rarr;</a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        pymChild.sendHeight();
    }

    window.toggleDetails = function(id) {
        const details = document.getElementById(id);
        details.classList.toggle('active');
        pymChild.sendHeight();
    }

    function applyFilters() {
        const searchTerm = document.getElementById('search').value.toLowerCase();
        const countyFilter = document.getElementById('filter-county').value;
        const typeFilter = document.getElementById('filter-type').value;
        const starFilter = document.getElementById('filter-stars').value;
        const drugFilter = document.getElementById('filter-drugs').value;

        const filteredPlans = allPlans.filter(plan => {
            const matchesSearch = plan.Name.toLowerCase().includes(searchTerm) || 
                                  plan.Companies.toLowerCase().includes(searchTerm);
            
            let matchesCounty = true;
            if (countyFilter !== 'all') {
                matchesCounty = plan.Name.includes(countyFilter);
            }

            let matchesType = true;
            if (typeFilter === 'd-snp') matchesType = plan.Name.includes('D-SNP');
            else if (typeFilter === 'c-snp') matchesType = plan.Name.includes('C-SNP');
            else if (typeFilter === 'i-snp') matchesType = plan.Name.includes('I-SNP');
            else if (typeFilter === 'standard') matchesType = !plan.Name.includes('SNP'); 

            let matchesStars = true;
            if (starFilter === '4') {
                const rating = parseFloat(plan['Star rating']);
                matchesStars = !isNaN(rating) && rating >= 4;
            }

            let matchesDrugs = true;
            const noDrugs = plan.drug_deductible === "No Part D drug coverage" || plan.drug_deductible === "Drugs covered separately";
            
            if (drugFilter === 'included') {
                matchesDrugs = !noDrugs;
            } else if (drugFilter === 'none') {
                matchesDrugs = noDrugs;
            }

            return matchesSearch && matchesCounty && matchesType && matchesStars && matchesDrugs;
        });

        renderPlans(filteredPlans);
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-county').addEventListener('change', applyFilters);
    document.getElementById('filter-type').addEventListener('change', applyFilters);
    document.getElementById('filter-stars').addEventListener('change', applyFilters);
    document.getElementById('filter-drugs').addEventListener('change', applyFilters);
</script>
</body>
</html>
