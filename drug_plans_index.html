<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 South Florida Prescription Drug Plans</title>
    
    <!-- Pym.js Resizer for iFrame Embeds -->
    <script src="https://pym.nprapps.org/pym.v1.min.js"></script>

    <style>
        :root {
            /* Blue accent colors for navigation */
            --accent: #0056b3;
            --accent-hover: #003d82;
        }

        /* --- Datawrapper-Inspired Newsroom Theme --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333333;
            background-color: #ffffff;
            margin: 0;
            padding: 10px;
            -webkit-overflow-scrolling: touch; 
        }

        .table-container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* Journalistic Copy Header Styles */
        .chart-header {
            margin-bottom: 22px;
        }

        .chart-title {
            font-size: 22px;
            font-weight: 700;
            color: #111111;
            margin: 0 0 6px 0;
            line-height: 1.2;
        }

        .chart-intro {
            font-size: 14px;
            color: #555555;
            margin: 0;
            line-height: 1.4;
        }

        /* Custom Dropdown Filters Toolbar */
        .custom-filter-toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding-bottom: 15px;
            border-bottom: 1px solid #ebeeec;
            position: sticky;
            top: 0;
            background-color: #ffffff;
            z-index: 1000;
            padding-top: 10px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #555555;
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }

        .filter-group input {
            width: 200px;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: #888888;
        }

        /* Card Layout */
        #plan-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            #plan-container {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        .card {
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 15px;
            background-color: #ffffff;
            transition: background-color 0.15s;
        }

        .card:hover {
            background-color: #f7f7f7;
        }

        .card-header {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ebeeec;
        }

        .company-name {
            font-size: 11px;
            color: #666666;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .plan-name {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            color: var(--accent);
            line-height: 1.3;
        }

        .key-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            color: #555555;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: #111111;
        }

        /* Expandable Details */
        .details-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #cccccc;
        }

        .details-content.active {
            display: block;
        }

        .details-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13.5px;
        }

        .details-list li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ebeeec;
        }

        .details-list li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .details-list strong {
            display: block;
            color: #555555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .toggle-btn {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .toggle-btn:hover {
            background-color: var(--accent-hover);
        }

        .card-footer {
            margin-top: 15px;
            text-align: left;
        }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .card-footer a:hover {
            text-decoration: underline;
            color: var(--accent-hover);
        }

        /* Source Footnote Styles */
        .chart-footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #ebeeec;
        }

        .chart-source {
            font-size: 11px;
            color: #666666;
            letter-spacing: 0.02em;
            margin: 0;
        }

        /* Accessibility Focus */
        button:focus-visible, 
        select:focus-visible, 
        input:focus-visible, 
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Mobile Breakpoints */
        @media (max-width: 640px) {
            .custom-filter-toolbar {
                flex-direction: column;
                gap: 10px;
            }
            .filter-group {
                width: 100%;
                justify-content: space-between;
            }
            .filter-group select, .filter-group input {
                width: 65%;
            }
        }
    </style>
</head>

<div class="table-container">
    <header class="chart-header">

        <p class="chart-intro">Search and filter standalone Medicare Part D prescription drug plans to compare premiums, deductibles, and pharmacy costs.</p>

    <div class="custom-filter-toolbar">
        <div class="filter-group">

        <div class="filter-group">

        </div>
        <div class="filter-group">

    </div>

    <div id="plan-container"></div>

    <footer class="chart-footer">
        <p class="chart-source">SOURCE: Medicare.gov and health plan providers.</p>

    function renderPlans(plans) {
        const container = document.getElementById('plan-container');
        container.innerHTML = '';

        if (plans.length === 0) {
            container.innerHTML = '<p style="font-size: 14px; color: #555555;">No plans match your selected filters. Try adjusting your search.</p>';
            pymChild.sendHeight();
            return;
        }

        plans.forEach((plan, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="card-header">
                    <p class="company-name">${plan['Parsed Company']}</p>
                    <h2 class="plan-name">${plan['Parsed Name']} (${plan['Parsed ID']})</h2>
                </div>
                
                <div class="key-stats">
                    <div class="stat">
                        <span class="stat-label">2027 Monthly Premium</span>
                        <span class="stat-value">${plan['2027 monthly premium']}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Star Rating</span>
                        <span class="stat-value">⭐ ${plan['2027 Medicare Part D rating (Summary rating of drug plan quality}']}</span>
                    </div>
                </div>

                <button class="toggle-btn" onclick="toggleDetails('details-${index}')">View details</button>

                <div id="details-${index}" class="details-content">
                    <ul class="details-list">
                        <li><strong>Company and plan name</strong> ${plan['Company and plan name']}</li>
                        <li><strong>2026 monthly premium</strong> ${plan['2026 monthly premium']}</li>
                        <li><strong>2027 annual premium</strong> ${plan['2027 annual premium']}</li>
                        <li><strong>Annual deductible</strong> ${plan['Annual deductible']}</li>
                        <li><strong>Your drug co-payments, after deductibles, from $0 to $2,400 of total drug costs  (initial coverage phase)</strong> ${plan['Your drug co-payments, after deductibles, from $0 to $2,400 of total drug costs  (initial coverage phase)']}</li>
                        <li><strong>There will be a $2,400 cap on out-of-pocket spending for covered Part D drugs. Once this amount is reached, the patient will automatically get "catastrophic coverage" and won't have to pay out-of-pocket for the rest of the year.</strong> ${plan['There will be a $2,400 cap on out-of-pocket spending for covered Part D drugs. Once this amount is reached, the patient will automatically get "catastrophic coverage" and won\'t have to pay out-of-pocket for the rest of the year. ']}</li>
                    </ul>
                    <div class="card-footer">
                        <a href="https://${plan['Parsed Website']}" target="_blank" rel="noopener noreferrer">Visit Plan Website &rarr;</a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        pymChild.sendHeight();
    }

    window.toggleDetails = function(id) {
        const details = document.getElementById(id);
        details.classList.toggle('active');
        pymChild.sendHeight();
    }

        const premiumFilter = document.getElementById('filter-premium').value;
        const starFilter = document.getElementById('filter-stars').value;

        const filteredPlans = allPlans.filter(plan => {
            
            // 1. Search Logic
            const matchesSearch = plan['Parsed Name'].toLowerCase().includes(searchTerm) || 
                                  plan['Company and plan name'].toLowerCase().includes(searchTerm);
            
            // 2. Premium Logic
            let matchesPremium = true;
            if (premiumFilter !== 'all') {
                // Remove the dollar sign and parse as float
                const premiumValue = parseFloat(plan['2027 monthly premium'].replace('$', ''));
                const filterThreshold = parseFloat(premiumFilter);
                matchesPremium = !isNaN(premiumValue) && premiumValue <= filterThreshold;
            }

            // 3. Star Rating Logic
            let matchesStars = true;
            if (starFilter !== 'all') {
                const rating = parseFloat(plan['2027 Medicare Part D rating (Summary rating of drug plan quality}']);
                const filterStars = parseFloat(starFilter);
                matchesStars = !isNaN(rating) && rating >= filterStars;
            }

            return matchesSearch && matchesPremium && matchesStars;
        });

        renderPlans(filteredPlans);
    }

    // Attach event listeners
    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-premium').addEventListener('change', applyFilters);
    document.getElementById('filter-stars').addEventListener('change', applyFilters);

    // Initial render
    renderPlans(allPlans);
</script>
</body>
</html>
